# HACS validation - the same checks the default-store inclusion runs.
# Required to pass (no errors, no ignores) before submitting to
# hacs/default; the schedule keeps catching regressions after.
name: Validate

on:
  push:
    branches: [HABirdDashboard]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: HACS Action
        uses: hacs/action@main
        with:
          category: plugin

  build-and-test:
    name: Build sync & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      # The committed dist/ is what HACS ships - an edit to the www
      # sources without a rebuild would silently serve a stale card.
      - name: dist matches source
        run: git diff --exit-code dist/
      - run: npm test
